name: Trivy Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Escaneo rápido diario con la base de datos de Trivy.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  trivy-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Poblar ~/.m2 antes de Trivy para evitar la resolución remota (429 de Maven Central).
      # Sin `-o`: en un runner limpio el plugin `dependency` aún no está en ~/.m2 y el
      # prefix offline falla con "No plugin found for prefix 'dependency'".
      - name: Resolve Maven dependencies (populate cache)
        run: mvn -q -B dependency:go-offline

      # Gate duro: CRITICAL/HIGH fijables hacen fallar el job.
      - name: Trivy filesystem scan
        id: trivy
        env:
          TRIVY_OFFLINE_SCAN: 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      # Mostrar los hallazgos en el log y en el step summary (el JSON va al artifact).
      - name: Print Trivy findings
        if: always()
        run: |
          {
            echo "## Trivy findings (CRITICAL/HIGH, unfixed excluidos)"
            if [ -s trivy-report.json ]; then
              FINDINGS=$(jq -r '
                [.Results[]? | .Target as $target | .Vulnerabilities[]?
                 | "- `\(.VulnerabilityID)` \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion // "sin fix") (\(.Severity)): \(.Title) [\($target)]"]
                | if length == 0 then "Sin vulnerabilidades detectadas." else .[] end
              ' trivy-report.json 2>/dev/null || echo "No se pudo parsear trivy-report.json")
            else
              FINDINGS="No se generó trivy-report.json."
            fi
            echo "$FINDINGS"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Advisories aceptados (sin parche upstream): falla si ya hay fix publicado.
      - name: Accepted advisories recheck (unpatched only)
        if: always()
        run: ./scripts/check-accepted-advisories.sh

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 30
          if-no-files-found: warn
