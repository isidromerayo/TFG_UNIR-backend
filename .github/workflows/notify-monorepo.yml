# Notifica al monorepo (evento repository_dispatch: submodule-updated)
# tras cada push a main, para que actualice el puntero de este submódulo.

name: Notify Monorepo on Main Update

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # Permite ejecución manual

jobs:
  notify-monorepo:
    name: Notify Monorepo to Update Submodules
    runs-on: ubuntu-latest
    
    steps:
    - name: Prepare commit message
      id: prepare
      run: |
        cat >> "$GITHUB_OUTPUT" <<'OUTPUTEOF'
        commit_message=${{ toJSON(github.event.head_commit.message) }}
        OUTPUTEOF

    - name: Notify monorepo repository
      uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4.0.1
      with:
        token: ${{ secrets.MONOREPO_DISPATCH_TOKEN }}
        repository: isidromerayo/TFG_UNIR-monorepo
        event-type: submodule-updated
        client-payload: |
          {
            "repository": "TFG_UNIR-backend",
            "ref": "${{ github.ref }}",
            "sha": "${{ github.sha }}",
            "commit_message": ${{ steps.prepare.outputs.commit_message }},
            "pusher": "${{ github.event.pusher.name }}",
            "timestamp": "${{ github.event.head_commit.timestamp }}"
          }