name: OSV Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Escaneo rápido diario contra la base de datos OSV.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  osv-scan:
    name: OSV Scanner (pom.xml)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Poblar ~/.m2 para que la resolución de transitivas no dependa de la red.
      - name: Resolve Maven dependencies (populate cache)
        run: mvn -q -o dependency:go-offline || mvn -q dependency:go-offline

      # Gate duro: cualquier vulnerabilidad no aceptada hace fallar el job.
      - name: OSV Scanner
        id: osv
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pom.xml
            --format=json
            --output=osv-report.json

      # Advisories aceptados (sin parche upstream): falla si ya hay fix publicado.
      - name: Accepted advisories recheck (unpatched only)
        run: ./scripts/check-accepted-advisories.sh

      - name: Upload OSV report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-report
          path: osv-report.json
          retention-days: 30
          if-no-files-found: warn
