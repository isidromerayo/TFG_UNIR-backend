name: OSV Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Escaneo rápido diario contra la base de datos OSV.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  osv-scan:
    name: OSV Scanner (pom.xml)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Gate duro: cualquier vulnerabilidad no aceptada hace fallar el job.
      - name: OSV Scanner
        id: osv
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pom.xml
            --format=json
            --output=osv-report.json

      # Mostrar los hallazgos en el log y en el step summary (el JSON va al artifact).
      - name: Print OSV findings
        if: always()
        run: |
          {
            echo "## OSV Scanner findings"
            if [ -s osv-report.json ]; then
              FINDINGS=$(jq -r '
                [.results[]?.packages[]? | select(.vulnerabilities != null)
                 | .package as $pkg | .vulnerabilities[]
                 | "- `\($pkg.name)@\($pkg.version // "?")` — \(.id): \(.summary // "sin resumen")"]
                | if length == 0 then "Sin vulnerabilidades detectadas." else .[] end
              ' osv-report.json 2>/dev/null || echo "No se pudo parsear osv-report.json")
            else
              FINDINGS="No se generó osv-report.json."
            fi
            echo "$FINDINGS"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Advisories aceptados (sin parche upstream): falla si ya hay fix publicado.
      - name: Accepted advisories recheck (unpatched only)
        if: always()
        run: ./scripts/check-accepted-advisories.sh

      - name: Upload OSV report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-report
          path: osv-report.json
          retention-days: 30
          if-no-files-found: warn
