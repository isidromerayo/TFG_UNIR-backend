name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  security-audit:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Poblar ~/.m2 antes de Trivy para evitar resolución remota (429 de Maven Central).
      - name: Resolve Maven dependencies (populate cache)
        run: mvn -q -o dependency:go-offline || mvn -q dependency:go-offline

      # 1. OSV Scanner: rápido, sin API key, resuelve transitivas de pom.xml.
      #    Gate duro: cualquier vulnerabilidad no aceptada hace fallar el job.
      - name: OSV Scanner
        id: osv
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pom.xml
            --format=json
            --output=osv-report.json

      # 2. Trivy filesystem scan: detecta pom.xml y JARs, cobertura complementaria.
      - name: Trivy filesystem scan
        id: trivy
        env:
          TRIVY_OFFLINE_SCAN: 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      # 3. Advisories aceptados (sin parche upstream): falla si ya hay fix publicado.
      - name: Accepted advisories recheck (unpatched only)
        run: ./scripts/check-accepted-advisories.sh

      # 4. Upload artifacts para análisis
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports
          path: |
            osv-report.json
            trivy-report.json
          retention-days: 30
          if-no-files-found: warn
