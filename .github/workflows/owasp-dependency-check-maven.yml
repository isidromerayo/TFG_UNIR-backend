name: OWASP Dependency Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  actions: write

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    # Los PRs de Dependabot usan un almacén de secretos propio: si NVD_API_KEY
    # sólo existe en los secrets de Actions, aquí llega vacía y dependency-check
    # 13 falla con "Invalid API Key, length of 0". Se expone como env para poder
    # guardar los pasos con `if: env.NVD_API_KEY != ''` (los secretos no son
    # válidos dentro de `if:`).
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK 21
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Debug NVD_API_KEY
      run: |
        if [[ -n "$NVD_API_KEY" ]]; then
          echo "NVD_API_KEY is set"
        else
          echo "NVD_API_KEY is NOT set"
        fi
    - name: Run OWASP Dependency Check
      if: env.NVD_API_KEY != ''
      # failOnError=false: las caídas del API de NVD (503 de NIST) o de datos
      # externos no deben romper el build. El informe se sigue generando/subiendo
      # y dependency-check avisa en el log de que usó datos cacheados.
      run: |
        mvn org.owasp:dependency-check-maven:check -f pom.xml \
          -Dnvd.api.key=$NVD_API_KEY \
          -DfailOnError=false
    - name: Upload Dependency Check Report
      if: env.NVD_API_KEY != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dependency-check-report
        path: target/dependency-check-report.html
    # Advisories aceptados (sin parche upstream): falla si ya hay fix publicado.
    # Regla y registro: docs/security/accepted-advisories.md
    - name: Accepted advisories recheck (unpatched only)
      run: ./scripts/check-accepted-advisories.sh
