##
# Datasource
##
spring.datasource.url=jdbc:h2:mem:test_tfg_academy;DB_CLOSE_ON_EXIT=FALSE;MODE=MariaDB
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# Data initialization
spring.sql.init.mode=always
spring.sql.init.platform=h2

# Hibernate Configuration
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
##
# API
##
spring.data.rest.basePath=/api
#
# swagger-ui custom path
#
springdoc.swagger-ui.path=/swagger-ui.html
# Debe coincidir con la versión del webjar org.webjars:swagger-ui declarada en pom.xml
# (springdoc 3.2.0 apunta por defecto a 5.34.0, con DOMPurify 3.4.16 vulnerable)
springdoc.swagger-ui.version=5.34.1

# ===============================
# = JWT CONFIGURATION (TEST)
# ===============================
jwt.secret=test-secret-key-for-unit-tests-only-not-for-production-use-minimum-256-bits
jwt.expiration=3600000

# ===============================
# = APPLICATION INFO (TEST)
# ===============================
info.app.version=0.0.1-test
